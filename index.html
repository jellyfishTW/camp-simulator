<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>營隊生存模擬器 | 旗艦版</title>
<style>
    /* ================= 現代化 CSS 樣式 ================= */
    :root {
        --primary: #54a0ff; --danger: #ff6b6b; --success: #1dd1a1; --warning: #feca57;
    }
    body, html { 
        margin: 0; padding: 0; background: linear-gradient(135deg, #c8d6e5 0%, #a4b0be 100%); 
        touch-action: none; user-select: none; -webkit-user-select: none;
        height: 100vh; display: flex; flex-direction: column; 
        align-items: center; justify-content: center;
        font-family: '微軟正黑體', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #game-container {
        width: 100%; max-width: 500px; background: #ffffff;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2); border-radius: 24px;
        overflow: hidden; display: flex; flex-direction: column;
        transition: transform 0.1s ease; /* 用於震動特效 */
    }
    #header { 
        background: linear-gradient(90deg, #2e86de, #54a0ff); color: white; 
        text-align: center; padding: 15px 0; font-size: 18px; font-weight: 900; letter-spacing: 2px;
    }
    
    #quest-bar {
        background: #fff9e6; color: #856404; padding: 10px 20px;
        font-size: 15px; font-weight: bold; border-bottom: 2px solid #ffe8a1;
        display: flex; justify-content: space-between; align-items: center;
    }
    #timer-display { background: #ffeaa7; padding: 4px 10px; border-radius: 12px; transition: color 0.3s; }

    #status-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 20px; background: #fafafa; border-bottom: 2px solid #eeeeee; font-weight: 900; color: #2d3436; 
    }
    #mood-bar-container {
        flex: 1; height: 16px; background: #dfe6e9; border-radius: 20px;
        margin: 0 15px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    #mood-bar {
        height: 100%; width: 100%; background: var(--success); 
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;
    }

    #canvas-wrapper { position: relative; width: 100%; aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center; background: #111; touch-action: none; overflow: hidden;}
    canvas { width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer;}
    
    /* 💎 毛玻璃對話框 (Glassmorphism) */
    #dialog-box {
        position: absolute; bottom: 4%; left: 4%; width: 92%;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 18px;
        display: none; font-size: 16px; line-height: 1.6; z-index: 10;
        box-sizing: border-box; pointer-events: auto; cursor: pointer;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15); transform: translateY(0); transition: 0.2s;
    }
    #dialog-box:active { transform: translateY(4px) scale(0.98); }
    #dialog-name { color: #2e86de; font-weight: 900; margin-bottom: 8px; font-size: 19px; border-bottom: 2px dashed rgba(46, 134, 222, 0.3); padding-bottom: 6px;}
    #dialog-hint { font-size: 13px; color: #888; margin-top: 12px; text-align: right; font-weight: bold; animation: pulse 1.5s infinite;}
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.95); } }
    
    #choices-container { display: none; flex-direction: column; gap: 10px; margin-top: 15px; }
    .choice-btn {
        background: linear-gradient(180deg, #54a0ff, #2e86de); color: white; padding: 12px; border-radius: 12px;
        text-align: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #0984e3; transition: 0.1s;
    }
    .choice-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #0984e3; }

    /* 結局畫面 */
    .overlay-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        color: white; display: none; flex-direction: column; justify-content: center; align-items: center;
        z-index: 100; text-align: center; backdrop-filter: blur(5px); animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #game-over-overlay { background: rgba(15, 15, 20, 0.9); }
    #happy-ending-overlay { background: rgba(255, 240, 200, 0.95); color: #d35400; }
    
    .btn-restart {
        margin-top: 25px; padding: 14px 28px; background: linear-gradient(180deg, #ff6b6b, #ee5253); color: white; text-shadow: none;
        border-radius: 14px; cursor: pointer; box-shadow: 0 4px 0 #b33939;
        font-size: 18px; font-weight: 900; transition: 0.1s; pointer-events: auto; letter-spacing: 1px;
    }
    .btn-restart:active { transform: translateY(4px); box-shadow: 0 0px 0 #b33939; }

    #footer-hint { padding: 16px; text-align: center; color: #576574; font-size: 14px; font-weight: bold; background: #f1f2f6; border-top: 1px solid #e1e6eb; line-height: 1.6; }

    /* 💥 震動特效 */
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
</style>
</head>
<body>

<div id="game-container">
    <div id="header">🏕️ 營隊生存模擬器</div>
    
    <div id="quest-bar">
        <span>📜 任務：解決危機 <span id="quest-progress">0/7</span></span>
        <span id="timer-display">⏱️ 80 秒</span>
    </div>

    <div id="status-bar">
        <div>💖 帶營隊心情</div>
        <div id="mood-bar-container"><div id="mood-bar"></div></div>
        <div id="mood-text">15/15</div>
    </div>
    
    <div id="canvas-wrapper">
        <div id="dialog-box">
            <div id="dialog-name"></div>
            <div id="dialog-text"></div>
            <div id="choices-container"></div>
            <div id="dialog-hint">▼ 點擊繼續</div>
        </div>
        
        <div id="start-screen-overlay" class="overlay-screen" style="display: flex; background: rgba(20, 30, 40, 0.95); z-index: 200;">
            <div style="font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));">🏕️</div>
            <div style="font-size: 30px; margin-bottom: 15px; color: #7bed9f; font-weight: 900; letter-spacing: 2px;">營隊生存模擬器</div>
            
            <div style="font-size: 15px; color: #dfe4ea; text-align: left; padding: 0 35px; line-height: 1.8; margin-bottom: 25px; background: rgba(255,255,255,0.05); border-radius: 12px; padding-top:15px; padding-bottom:15px; border: 1px solid rgba(255,255,255,0.1);">
                📌 <b>任務目標：</b> 在計時結束前解決 <b>7位角色</b> 的狀況。<br><br>
                📌 <b>生存法則：</b><br>
                🚶 每走 8 步扣 1 點心情。<br>
                💬 對話選錯回應會大扣心情！<br>
                🕵️ 你的每一個選擇都會影響最終評價！<br>
            </div>
            
            <div class="btn-restart" onclick="startGame()" style="background: linear-gradient(180deg, #1dd1a1, #10ac84); box-shadow: 0 4px 0 #019066;">開始挑戰</div>
        </div>

        <div id="game-over-overlay" class="overlay-screen">
            <div id="game-over-title" style="font-size: 38px; margin-bottom: 10px; font-weight: 900; color: #ff6b6b;">🥀 心情耗盡</div>
            <div id="game-over-desc" style="font-size: 16px; color: #c8d6e5; padding: 0 20px; line-height: 1.5;">小學員暴走、進度落後，你累癱在營隊中。</div>
            <div class="btn-restart" onclick="restartGame()">重新開始</div>
        </div>

        <div id="happy-ending-overlay" class="overlay-screen">
            <div id="happy-ending-icon" style="font-size: 55px; margin-bottom: 10px;">🎉</div>
            <div id="happy-ending-title" style="font-size: 38px; margin-bottom: 10px; font-weight: 900;">完美解決！</div>
            <div id="happy-ending-desc" style="font-size: 16px; color: #d35400; font-weight: bold; padding: 0 20px; line-height: 1.6;">你成功解決了所有危機！</div>
            <div class="btn-restart" onclick="restartGame()" style="background: linear-gradient(180deg, #ff9f43, #f368e0); box-shadow: 0 4px 0 #b71540;">再次挑戰</div>
        </div>

        <canvas id="gameCanvas" width="480" height="480"></canvas>
    </div>

    <div id="footer-hint">
        👆 點地板移動 (小心走動的小孩)<br>
        💬 點人物或 🚪 門可自動尋路過去
    </div>
</div>

<script>
    // ==========================================
    // ⚙️ 遊戲核心設定
    // ==========================================
    const GAME_TIME_SECONDS = 80; 
    let remainingTime = GAME_TIME_SECONDS;
    let timerInterval = null; 

    const MAX_HIDDEN_SCORE = 7;
    let currentHiddenScore = MAX_HIDDEN_SCORE;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const dialogBox = document.getElementById('dialog-box');
    const dialogName = document.getElementById('dialog-name');
    const dialogText = document.getElementById('dialog-text');
    const dialogHint = document.getElementById('dialog-hint');
    const choicesContainer = document.getElementById('choices-container');
    const gameContainer = document.getElementById('game-container');

    const TILE_SIZE = 40;
    const COLS = 12; 
    const ROWS = 12;

    // 🌟 V2.0 新增：視覺平滑座標 (用於 requestAnimationFrame)
    let player = { gridX: 5, gridY: 5, pixelX: 200, pixelY: 200, icon: '🧚‍♀️', facing: 'down' };
    let currentScene = 'classroom';
    
    let isGameStarted = false; 
    let isDialogActive = false;
    let isGameOver = false;
    let currentDialogNPC = null; 
    let currentDialogIndex = 0;  
    
    let talkedTo = new Set();
    const requiredNPCs = ['小明', '小偉', '大華', '小美', '總籌', '邱曉昕', '副籌'];
    const QUEST_GOAL = requiredNPCs.length;

    const MAX_MOOD = 15; 
    let currentMood = MAX_MOOD;
    let stepCount = 0; 

    // 🌟 V2.0 新增：漂浮文字系統陣列
    let floatingTexts = [];

    // --- 像素材質 ---
    const textures = {};
    function initTextures() {
        const wood = document.createElement('canvas'); wood.width = TILE_SIZE; wood.height = TILE_SIZE; const wCtx = wood.getContext('2d');
        wCtx.fillStyle = '#c79c6e'; wCtx.fillRect(0,0,TILE_SIZE,TILE_SIZE); wCtx.fillStyle = '#a17346';
        wCtx.fillRect(0, 0, TILE_SIZE, 2); wCtx.fillRect(0, 20, TILE_SIZE, 2); wCtx.fillRect(20, 0, 2, 20); wCtx.fillRect(0, 20, 2, 20);
        wCtx.fillStyle = '#b38455'; wCtx.fillRect(4, 4, 12, 2); wCtx.fillRect(24, 8, 12, 2); wCtx.fillRect(8, 12, 10, 2); wCtx.fillRect(28, 16, 8, 2);
        wCtx.fillRect(4, 24, 12, 2); wCtx.fillRect(24, 28, 12, 2); wCtx.fillStyle = '#d9b288'; wCtx.fillRect(2, 2, 18, 2); wCtx.fillRect(22, 22, 18, 2);
        textures.wood = ctx.createPattern(wood, 'repeat');

        const grass = document.createElement('canvas'); grass.width = TILE_SIZE; grass.height = TILE_SIZE; const gCtx = grass.getContext('2d');
        gCtx.fillStyle = '#7ebd4e'; gCtx.fillRect(0,0,TILE_SIZE,TILE_SIZE); gCtx.fillStyle = '#5c9634';
        gCtx.fillRect(6, 6, 4, 12); gCtx.fillRect(10, 10, 4, 8); gCtx.fillRect(26, 22, 4, 12); gCtx.fillRect(30, 26, 4, 8);
        gCtx.fillStyle = '#9fdf6d'; gCtx.fillRect(4, 6, 2, 8); gCtx.fillRect(24, 22, 2, 8); gCtx.fillRect(16, 14, 4, 4); gCtx.fillRect(34, 6, 4, 4);
        textures.grass = ctx.createPattern(grass, 'repeat');
    }
    initTextures();

    // ==========================================
    // 📖 劇本資料
    // ==========================================
    const scenes = {
        classroom: {
            type: 'wood',
            objects: [
                { x: 2, y: 5, w: 1, h: 1, icon: '🪑' }, { x: 3, y: 5, w: 1, h: 1, icon: '🪑' }, { x: 4, y: 5, w: 1, h: 1, icon: '🪑' },
                { x: 7, y: 5, w: 1, h: 1, icon: '🪑' }, { x: 8, y: 5, w: 1, h: 1, icon: '🪑' }, { x: 9, y: 5, w: 1, h: 1, icon: '🪑' },
                { x: 2, y: 8, w: 1, h: 1, icon: '🪑' }, { x: 3, y: 8, w: 1, h: 1, icon: '🪑' }, { x: 4, y: 8, w: 1, h: 1, icon: '🪑' },
                { x: 7, y: 8, w: 1, h: 1, icon: '🪑' }, { x: 8, y: 8, w: 1, h: 1, icon: '🪑' }, { x: 9, y: 8, w: 1, h: 1, icon: '🪑' }
            ],
            items: [
                { x: 10, y: 2, icon: '🍬', name: '潤喉糖', heal: 2, picked: false },
                { x: 1, y: 10, icon: '🍬', name: '潤喉糖', heal: 2, picked: false }
            ],
            portal: { x: 5, y: 10, icon: '🚪', toScene: 'outdoor', toX: 5, toY: 1 },
            npcs: [
                { x: 5, y: 1, icon: '👨‍🏫', name: '瓜瓜', canMove: false, msgs: ['為什麼還安靜不下來？', '請各位隊輔幫我管秩序！','(你的心情也受影響 心情 -1)'] ,moodChange: -1},
                { 
                    x: 2, y: 4, icon: '👦', name: '小明', canMove: true, 
                    msgs: [
                        '好無聊喔我要出去打球...', '我聽不懂啦...', '下午的大地跑跑好玩嗎？',
                        { question: '小明不想上課，你要怎麼回應？', 
                          choices: [
                            { text: '語氣堅定告訴他專心上課並陪他', moodChange: 0, hiddenScore: 0, reply: '好啦...既然你願意陪我，我就專心聽。' },
                            { text: '大聲喝斥他安靜', moodChange: -3, hiddenScore: -1, reply: '凶屁凶！(小明大哭，你身心俱疲 心情 -3)' }
                          ] 
                        }
                    ] 
                },
                { 
                    x: 2, y: 7, icon: '🧒', name: '小偉', canMove: false, 
                    msgs: [
                        '老師我剛剛有回答問題', '為什麼沒有給我點點貼紙',
                        { question: '小偉覺得不公平，你要怎麼做？',
                          choices: [
                            { text: '馬上補給他一張貼紙', moodChange: 0, hiddenScore: 0, reply: '耶！謝謝老師！' },
                            { text: '叫他安靜不要吵鬧', moodChange: -2, hiddenScore: -1, reply: '老師偏心！(小偉鬧脾氣 心情 -2)' }
                          ]
                        }
                    ] 
                },
                { 
                    x: 8, y: 4, icon: '👦', name: '大華', canMove: true,
                    msgs: [
                        '老師你不要管我', '幹嘛管這麼多...', '你又不是我媽！',
                        { question: '大華正在到處亂跑，你要怎麼做？',
                          choices: [
                            { text: '先讓他冷靜下來，說明營隊規定', moodChange: 0, hiddenScore: 0, reply: '好吧。(大華安靜了下來)' },
                            { text: '讓他原地罰站', moodChange: -4, hiddenScore: -1, reply: '我不要！(大華跑走，場面失控 心情 -4)' }
                          ]
                        }
                    ] 
                },
                { 
                    x: 8, y: 7, icon: '👧', name: '小美', canMove: false,
                    msgs: [
                        '小明好吵喔...', '老師你可以叫他出去嗎？', '我也不想上課了',
                        { question: '小美被影響了，你要怎麼辦？',
                          choices: [
                            { text: '告訴他你會去提醒小明', moodChange: 0, hiddenScore: 0, reply: '好，謝謝老師。' },
                            { text: '跟他說再忍耐一下', moodChange: -2, hiddenScore: -1, reply: '不管啦我要回家！(受到影響 心情 -2)' }
                          ]
                        }
                    ] 
                }
            ]
        },
        outdoor: {
            type: 'grass', 
            objects: [
                { x: 1, y: 2, w: 2, h: 2, icon: '🌳' }, { x: 2, y: 1, w: 1, h: 1, icon: '🌲' },
                { x: 8, y: 2, w: 2, h: 2, icon: '⛺' }, { x: 8, y: 8, w: 2, h: 2, icon: '⛺' }  
            ],
            items: [
                { x: 2, y: 9, icon: '🧋', name: '慰勞的飲料', heal: 5, picked: false },
                { x: 10, y: 6, icon: '🧋', name: '慰勞的飲料', heal: 5, picked: false },
                { x: 8, y: 4, icon: '🍌', name: '地上的香蕉皮', heal: -2, picked: false }
            ],
            portal: { x: 5, y: 0, icon: '🚪', toScene: 'classroom', toX: 5, toY: 9 },
            npcs: [
                { 
                    x: 5, y: 5, icon: '🧢', name: '總籌', canMove: true,
                    msgs: [
                        '大地跑跑馬上要開始了！', '為什麼還在場佈？？？',
                        { question: '總籌正在焦慮，你要如何回應？',
                          choices: [
                            { text: '捲起袖子一起加快場佈', moodChange: -1, hiddenScore: 0, reply: '快點快點！(體力消耗 心情 -1)' },
                            { text: '不知道怎麼辦', moodChange: -4, hiddenScore: -1, reply: '完啦完啦要開天窗了！(慌張 心情 -4)' }
                          ]              
                        }
                    ] 
                },
                { 
                    x: 5, y: 7, icon: '🕶️', name: '副籌', canMove: true,
                    msgs: [
                        '你們小隊有小孩在亂跑', '趕快去把他抓回來',
                        { question: '你的回應是？',
                          choices: [
                            { text: '(立刻跑起來開始找人)', moodChange: -2, hiddenScore: 0, reply: '成功把人找回來，但你覺得累。(心情 -2)' },
                            { text: '其他人會負責的', moodChange: -4, hiddenScore: -1, reply: '(被督導發現念了你們一頓 心情 -4)' }
                          ]              
                        }
                    ] 
                },
                { 
                    x: 10, y: 5, icon: '👨‍🦱', name: '邱曉昕', canMove: false, 
                    msgs: [
                        '我們督導說要請你們開始雨備方案', '你說沒有下雨？', '沒辦法，他擔心孩子們的安全。',
                        { question: '面對突如其來的指令，你決定？',
                          choices: [
                            { text: '直接果斷切換雨備', moodChange: -1, hiddenScore: 0, reply: '好的，大家動起來！(覺得可惜 心情-1)' },
                            { text: '耐心解釋真的沒下雨', moodChange: -3, hiddenScore: -1, reply: '可是督導說... (溝通無效，心累 心情 -3)' }
                          ]
                        }
                    ] 
                }
            ]
        }
    };

    // 初始化 NPC
    for (let s in scenes) {
        for (let npc of scenes[s].npcs) {
            npc.gridX = npc.x; npc.gridY = npc.y;
            npc.pixelX = npc.x * TILE_SIZE; npc.pixelY = npc.y * TILE_SIZE;
            npc.startX = npc.x; npc.startY = npc.y;
        }
    }

    // ==========================================
    // 🚀 遊戲系統
    // ==========================================
    function startGame() {
        isGameStarted = true;
        document.getElementById('start-screen-overlay').style.display = 'none';
        startTimer(); 
    }

    function updateTimerUI() {
        const timerDisplay = document.getElementById('timer-display');
        timerDisplay.innerText = `⏱️ ${remainingTime} 秒`;
        timerDisplay.style.color = remainingTime <= 10 ? '#e84118' : '#856404';
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        updateTimerUI(); 
        timerInterval = setInterval(() => {
            if (isGameOver || !isGameStarted) return; 
            remainingTime--; updateTimerUI();
            if (remainingTime <= 0) triggerGameOver("timeup");
        }, 1000);
    }

    // 🌟 V2.0：漂浮文字管理器
    function addFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1.0 });
    }

    // 🌟 V2.0：震動特效管理器
    function triggerShake() {
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth; // 觸發 reflow
        gameContainer.classList.add('shake');
    }

    function updateMoodUI() {
        const bar = document.getElementById('mood-bar');
        const text = document.getElementById('mood-text');
        let percentage = Math.max(0, (currentMood / MAX_MOOD) * 100);
        bar.style.width = percentage + '%'; text.innerText = `${currentMood}/${MAX_MOOD}`;
        if (currentMood > (MAX_MOOD/2)) bar.style.background = 'var(--success)'; 
        else if (currentMood > (MAX_MOOD/4)) bar.style.background = 'var(--warning)'; 
        else bar.style.background = 'var(--danger)'; 
    }

    function changeMood(amount, sourceX = player.pixelX, sourceY = player.pixelY) {
        if (amount === 0) return;
        currentMood = Math.min(MAX_MOOD, currentMood + amount);
        updateMoodUI();
        
        // 彈出漂浮文字
        let color = amount > 0 ? '#1dd1a1' : '#ff6b6b';
        let text = amount > 0 ? `+${amount}` : `${amount}`;
        addFloatingText(sourceX + TILE_SIZE/2, sourceY, text, color);

        // 如果是大扣血，觸發震動
        if (amount <= -3) triggerShake();

        if (currentMood <= 0) triggerGameOver("mood"); 
    }

    function triggerGameOver(reason = "mood") {
        isGameOver = true; clearInterval(timerInterval); 
        dialogBox.style.display = 'none'; isDialogActive = false; currentDialogNPC = null;
        
        const title = document.getElementById('game-over-title');
        const desc = document.getElementById('game-over-desc');
        
        if (reason === "timeup") {
            title.innerText = '⏰ 時間到！';
            desc.innerText = '動作太慢了，營隊大混亂，進度嚴重落後...';
        } else {
            title.innerText = '🥀 心情耗盡';
            desc.innerText = '小學員暴走、進度落後，你累癱在營隊中。';
        }
        document.getElementById('game-over-overlay').style.display = 'flex';
    }

    function updateQuestUI() {
        document.getElementById('quest-progress').innerText = `${talkedTo.size}/${QUEST_GOAL}`;
    }

    function restartGame() {
        currentMood = MAX_MOOD; stepCount = 0; talkedTo.clear(); currentHiddenScore = MAX_HIDDEN_SCORE; remainingTime = GAME_TIME_SECONDS; 
        document.getElementById('timer-display').style.color = '#856404';
        
        updateQuestUI(); updateMoodUI(); floatingTexts = [];
        currentScene = 'classroom'; 
        player.gridX = 5; player.gridY = 5; player.pixelX = 5*TILE_SIZE; player.pixelY = 5*TILE_SIZE;
        
        isGameOver = false; isDialogActive = false; currentDialogNPC = null; dialogBox.style.display = 'none'; 
        
        for (let s in scenes) { 
            scenes[s].items?.forEach(i => i.picked = false); 
            scenes[s].npcs?.forEach(npc => { npc.gridX = npc.startX; npc.gridY = npc.startY; npc.pixelX = npc.startX*TILE_SIZE; npc.pixelY = npc.startY*TILE_SIZE;});
        }
        
        document.getElementById('game-over-overlay').style.display = 'none'; document.getElementById('happy-ending-overlay').style.display = 'none';
        startTimer(); 
    }

    // --- 自動尋路系統 ---
    function isWalkable(x, y) {
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
        const scene = scenes[currentScene];
        for (let obj of scene.objects) if (x >= obj.x && x < obj.x + obj.w && y >= obj.y && y < obj.y + obj.h) return false;
        for (let npc of scene.npcs) if (x === npc.gridX && y === npc.gridY) return false;
        return true;
    }

    function findPath(startX, startY, targetX, targetY, isTargetNPC) {
        if (isTargetNPC && Math.abs(startX - targetX) + Math.abs(startY - targetY) === 1) return [];
        let queue = [{ x: startX, y: startY, path: [] }];
        let visited = new Set([`${startX},${startY}`]);

        while (queue.length > 0) {
            let curr = queue.shift();
            if (isTargetNPC && Math.abs(curr.x - targetX) + Math.abs(curr.y - targetY) === 1) return curr.path;
            if (!isTargetNPC && curr.x === targetX && curr.y === targetY) return curr.path;

            const neighbors = [{ x: curr.x, y: curr.y - 1, dir: 'up' }, { x: curr.x, y: curr.y + 1, dir: 'down' }, { x: curr.x - 1, y: curr.y, dir: 'left' }, { x: curr.x + 1, y: curr.y, dir: 'right' }];
            for (let n of neighbors) {
                if (isWalkable(n.x, n.y) && !visited.has(`${n.x},${n.y}`)) {
                    visited.add(`${n.x},${n.y}`); queue.push({ x: n.x, y: n.y, path: [...curr.path, { x: n.x, y: n.y, dir: n.dir }] });
                }
            }
        }
        return null; 
    }

    // 🌟 V2.0：路徑佇列，由繪圖迴圈處理平滑移動
    let pathQueue = [];
    let isMoving = false;
    let finalPathAction = null;

    function startWalk(path, action) {
        pathQueue = path;
        finalPathAction = action;
        isMoving = true;
    }

    // --- 對話系統 ---
    function renderDialog() {
        let msg = currentDialogNPC.msgs[currentDialogIndex];
        if (typeof msg === 'string') {
            dialogText.innerText = msg;
            dialogHint.style.display = 'block'; choicesContainer.style.display = 'none';
            dialogHint.innerText = (currentDialogIndex < currentDialogNPC.msgs.length - 1) ? '▼ 點擊繼續' : '▼ 點擊結束';
        } else {
            dialogText.innerText = msg.question;
            dialogHint.style.display = 'none'; choicesContainer.innerHTML = '';
            msg.choices.forEach(choice => {
                let btn = document.createElement('div'); btn.className = 'choice-btn'; btn.innerText = choice.text;
                btn.onpointerdown = (e) => {
                    e.stopPropagation();
                    changeMood(choice.moodChange); currentHiddenScore += choice.hiddenScore;
                    if (isGameOver) return;
                    
                    dialogText.innerText = choice.reply;
                    choicesContainer.style.display = 'none'; dialogHint.style.display = 'block'; dialogHint.innerText = '▼ 點擊結束';
                    currentDialogIndex = currentDialogNPC.msgs.length; 
                };
                choicesContainer.appendChild(btn);
            });
            choicesContainer.style.display = 'flex';
        }
    }

    function startDialog(npc) {
        if (isGameOver) return; 
        
        let cost = npc.moodChange !== undefined ? npc.moodChange : -1;
        changeMood(cost, npc.pixelX, npc.pixelY);
        
        if (isGameOver) return;

        if (requiredNPCs.includes(npc.name) && !talkedTo.has(npc.name)) {
            talkedTo.add(npc.name); updateQuestUI();
        }

        currentDialogNPC = npc; currentDialogIndex = 0; dialogName.innerText = npc.name;
        dialogBox.style.display = 'block'; isDialogActive = true;
        renderDialog();
    }

    dialogBox.addEventListener('pointerdown', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (typeof currentDialogNPC.msgs[currentDialogIndex] === 'object') return;

        if (currentDialogNPC && currentDialogIndex < currentDialogNPC.msgs.length - 1) {
            currentDialogIndex++; renderDialog();
        } else {
            dialogBox.style.display = 'none'; isDialogActive = false; currentDialogNPC = null; 
            
            if (talkedTo.size >= QUEST_GOAL && currentMood > 0 && remainingTime > 0) {
                isGameOver = true; clearInterval(timerInterval); 
                
                const heIcon = document.getElementById('happy-ending-icon');
                const heTitle = document.getElementById('happy-ending-title');
                const heDesc = document.getElementById('happy-ending-desc');
                
                if (currentHiddenScore >= (MAX_HIDDEN_SCORE / 2)) {
                    heIcon.innerText = '🎉'; heTitle.innerText = '完美結營！'; heTitle.style.color = '#d35400';
                    heDesc.innerHTML = `隱藏評價分數：${currentHiddenScore}/${MAX_HIDDEN_SCORE}<br><br>你成功解決了所有危機，而且處事非常成熟！<br>大家都覺得你是一位超級優秀的隊輔！`;
                    heDesc.style.color = '#b33939';
                } else {
                    heIcon.innerText = '😅'; heTitle.innerText = '勉強結營...'; heTitle.style.color = '#555';
                    heDesc.innerHTML = `隱藏評價分數：${currentHiddenScore}/${MAX_HIDDEN_SCORE}<br><br>雖然你撐過了營隊，但處理危機的方式太過急躁。<br>下次再多點耐心吧！`;
                    heDesc.style.color = '#555';
                }
                document.getElementById('happy-ending-overlay').style.display = 'flex';
            }
        }
    });

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault(); if (!isGameStarted || isDialogActive || isGameOver) return; 
        
        const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
        const targetGridX = Math.floor(((e.clientX - rect.left) * scaleX) / TILE_SIZE); const targetGridY = Math.floor(((e.clientY - rect.top) * scaleY) / TILE_SIZE);
        const scene = scenes[currentScene];

        let clickedNPC = scene.npcs.find(n => n.gridX === targetGridX && n.gridY === targetGridY);
        
        if (clickedNPC) {
            let path = findPath(player.gridX, player.gridY, clickedNPC.gridX, clickedNPC.gridY, true);
            if (path !== null) startWalk(path, () => { 
                let isStillAdjacent = Math.abs(player.gridX - clickedNPC.gridX) + Math.abs(player.gridY - clickedNPC.gridY) === 1;
                if (isStillAdjacent) {
                    player.facing = clickedNPC.gridX > player.gridX ? 'right' : clickedNPC.gridX < player.gridX ? 'left' : clickedNPC.gridY > player.gridY ? 'down' : 'up';
                    startDialog(clickedNPC); 
                }
            });
        } 
        else if (targetGridX === scene.portal.x && targetGridY === scene.portal.y) {
            let path = findPath(player.gridX, player.gridY, targetGridX, targetGridY, true);
            if (path !== null) startWalk(path, () => { 
                currentScene = scene.portal.toScene; 
                player.gridX = scene.portal.toX; player.gridY = scene.portal.toY; 
                player.pixelX = player.gridX * TILE_SIZE; player.pixelY = player.gridY * TILE_SIZE;
            });
        }
        else if (isWalkable(targetGridX, targetGridY)) {
            let path = findPath(player.gridX, player.gridY, targetGridX, targetGridY, false);
            if (path !== null) startWalk(path, null);
        }
    });

    // --- 🤖 NPC 隨機移動 ---
    setInterval(() => {
        if (!isGameStarted || isDialogActive || isGameOver) return;
        const scene = scenes[currentScene];
        
        for (let npc of scene.npcs) {
            if (!npc.canMove || Math.random() > 0.6) continue;

            const dirs = [ {dx:0,dy:-1}, {dx:0,dy:1}, {dx:-1,dy:0}, {dx:1,dy:0} ];
            const dir = dirs[Math.floor(Math.random() * dirs.length)];
            const nx = npc.gridX + dir.dx; const ny = npc.gridY + dir.dy;

            if (Math.abs(nx - npc.startX) > 3 || Math.abs(ny - npc.startY) > 3) continue;
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
            if (nx === player.gridX && ny === player.gridY) continue; 
            if (nx === scene.portal.x && ny === scene.portal.y) continue; 
            
            let collision = false;
            for (let obj of scene.objects) if (nx >= obj.x && nx < obj.x + obj.w && ny >= obj.y && ny < obj.y + obj.h) collision = true;
            for (let otherNpc of scene.npcs) if (nx === otherNpc.gridX && ny === otherNpc.gridY) collision = true;
            
            if (!collision) {
                npc.gridX = nx; npc.gridY = ny;
            }
        }
    }, 1200);

    // ==========================================
    // 🎨 【V2.0 順滑繪圖引擎 (requestAnimationFrame)】
    // ==========================================
    function lerp(start, end, factor) { return start + (end - start) * factor; }

    function drawNameLabel(name, px, py, isPlayer = false) {
        ctx.font = '900 12px "微軟正黑體", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.strokeText(name, px, py - 4);
        ctx.fillStyle = isPlayer ? '#ffd32a' : '#ffffff'; ctx.fillText(name, px, py - 4);
    }

    function drawGraphic(icon, px, py, sizeClass = 30) {
        ctx.fillStyle = '#000000'; ctx.font = `${sizeClass}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(icon, px, py + 2);
    }

    function gameLoop(timestamp) {
        const scene = scenes[currentScene];
        
        // 1. 玩家平滑移動邏輯
        if (isMoving && pathQueue.length > 0) {
            let targetX = pathQueue[0].x * TILE_SIZE;
            let targetY = pathQueue[0].y * TILE_SIZE;
            
            // 逼近目標
            player.pixelX = lerp(player.pixelX, targetX, 0.2);
            player.pixelY = lerp(player.pixelY, targetY, 0.2);
            player.facing = pathQueue[0].dir;

            // 抵達該格
            if (Math.abs(player.pixelX - targetX) < 1 && Math.abs(player.pixelY - targetY) < 1) {
                player.gridX = pathQueue[0].x;
                player.gridY = pathQueue[0].y;
                player.pixelX = targetX; player.pixelY = targetY;
                pathQueue.shift();
                
                // 檢查道具
                let item = scene.items?.find(i => i.x === player.gridX && i.y === player.gridY && !i.picked);
                if (item) { item.picked = true; changeMood(item.heal); }

                stepCount++;
                if (stepCount >= 8) { stepCount = 0; changeMood(-1); }

                // 走完路徑
                if (pathQueue.length === 0) {
                    isMoving = false;
                    if (finalPathAction) finalPathAction();
                }
            }
        }

        // NPC 平滑移動
        for (let npc of scene.npcs) {
            npc.pixelX = lerp(npc.pixelX, npc.gridX * TILE_SIZE, 0.15);
            npc.pixelY = lerp(npc.pixelY, npc.gridY * TILE_SIZE, 0.15);
        }

        // --- 繪製畫面 ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 畫地板
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                ctx.fillStyle = scene.type === 'grass' ? textures.grass : textures.wood;
                ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }

        // 畫門
        drawGraphic(scene.portal.icon, scene.portal.x * TILE_SIZE + TILE_SIZE/2, scene.portal.y * TILE_SIZE + TILE_SIZE/2);
        
        // 畫道具 (加入呼吸浮動動畫)
        let breatheOffset = Math.sin(timestamp / 200) * 3; 
        if (scene.items) {
            for (let item of scene.items) { 
                if (!item.picked) drawGraphic(item.icon, item.x * TILE_SIZE + TILE_SIZE/2, item.y * TILE_SIZE + TILE_SIZE/2 + breatheOffset); 
            }
        }

        // 畫靜態物件
        for (let obj of scene.objects) {
            let w = obj.w; let h = obj.h;
            let cx = obj.x * TILE_SIZE + (w * TILE_SIZE)/2; let cy = obj.y * TILE_SIZE + (h * TILE_SIZE)/2;
            drawGraphic(obj.icon, cx, cy, w > 1 ? 55 : 30);
        }

        // 畫 NPC
        for (let npc of scene.npcs) {
            let cx = npc.pixelX + TILE_SIZE/2; let cy = npc.pixelY + TILE_SIZE/2;
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(cx, cy + 12, 12, 6, 0, 0, Math.PI*2); ctx.fill(); // 陰影
            drawGraphic(npc.icon, cx, cy + breatheOffset); 
            drawNameLabel(npc.name, cx, cy); 
        }

        // 畫玩家
        let px = player.pixelX + TILE_SIZE/2; let py = player.pixelY + TILE_SIZE/2;
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(px, py + 12, 12, 6, 0, 0, Math.PI*2); ctx.fill();
        drawGraphic(player.icon, px, py + breatheOffset);
        drawNameLabel("隊輔", px, py, true); 

        // 畫視線指示器
        ctx.fillStyle = "rgba(84, 160, 255, 0.8)"; ctx.beginPath();
        if(player.facing === 'up') { ctx.moveTo(px, py-22); ctx.lineTo(px-6, py-14); ctx.lineTo(px+6, py-14); }
        if(player.facing === 'down') { ctx.moveTo(px, py+22); ctx.lineTo(px-6, py+14); ctx.lineTo(px+6, py+14); }
        if(player.facing === 'left') { ctx.moveTo(px-22, py); ctx.lineTo(px-14, py-6); ctx.lineTo(px-14, py+6); }
        if(player.facing === 'right') { ctx.moveTo(px+22, py); ctx.lineTo(px+14, py-6); ctx.lineTo(px+14, py+6); }
        ctx.fill();

        // 🌟 V2.0：繪製漂浮文字
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 0.5; // 緩緩上升
            ft.life -= 0.02; // 生命週期扣除
            if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
            
            ctx.font = '900 20px "微軟正黑體", sans-serif';
            ctx.textAlign = 'center';
            ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
            ctx.globalAlpha = ft.life; // 淡出
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(gameLoop);
    }

    // 啟動迴圈
    requestAnimationFrame(gameLoop);

</script>
</body>

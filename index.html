<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>營隊生存模擬器 | MMO 旗艦版</title>
<style>
    /* ================= ⚔️ MMO 現代化 CSS 樣式 ⚔️ ================= */
    :root {
        --primary: #4facfe; --danger: #ff4757; --success: #2ed573; --warning: #ffa502;
        --hud-bg: rgba(15, 20, 30, 0.75); --hud-border: rgba(79, 172, 254, 0.4);
    }
    
    body, html { 
        margin: 0; padding: 0; background: #050505; 
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        width: 100vw; overflow: hidden;
        height: 100vh; height: 100dvh; 
        font-family: '微軟正黑體', -apple-system, sans-serif;
    }
    
    #game-container {
        position: relative; width: 100%; height: 100%; 
        display: flex; justify-content: center; align-items: center; 
    }
    
    #canvas-wrapper {
        position: relative; width: 100%; max-width: 1200px; aspect-ratio: 16 / 10;
        box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }
    
    canvas { 
        width: 100%; height: 100%; display: block;
        object-fit: contain; image-rendering: pixelated; cursor: crosshair;
    }

    /* ================= 🛡️ HUD 介面 ================= */
    #hud-container {
        position: absolute; top: env(safe-area-inset-top, 10px); left: 0; width: 100%;
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 15px 20px; box-sizing: border-box; z-index: 20; pointer-events: none;
    }

    .hud-panel {
        background: var(--hud-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--hud-border); border-radius: 12px; color: #fff; pointer-events: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #hud-player { display: flex; align-items: center; padding: 8px 15px 8px 8px; border-radius: 50px; }
    #player-avatar { font-size: 30px; background: linear-gradient(135deg, #2f3542, #1e272e); border: 2px solid var(--primary); border-radius: 50%; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px var(--primary); margin-right: 15px; overflow: hidden; }
    #player-avatar img { width: 85%; height: 85%; object-fit: contain; display: none; }
    #player-info { display: flex; flex-direction: column; width: 170px;}
    #player-name { font-size: 15px; font-weight: 900; color: var(--primary); text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
    #hp-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; overflow: hidden; border: 1px solid #333;}
    #hp-bar { height: 100%; width: 100%; background: var(--success); transition: width 0.3s, background 0.3s; box-shadow: inset 0 0 5px rgba(255,255,255,0.5);}

    #hud-quest { padding: 15px; min-width: 215px; }
    .quest-title { font-size: 14px; color: var(--warning); font-weight: 900; margin-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 5px; letter-spacing: 1px;}
    .quest-item { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px;}
    #timer-display { font-size: 18px; font-weight: 900; color: #fff; text-align: center; margin-top: 8px; text-shadow: 0 0 8px rgba(255,255,255,0.5);}

    #hud-chat { position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 20px; padding: 10px; width: 280px; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; border: none; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); box-shadow: none; z-index: 10; pointer-events: none;}
    .chat-msg { font-size: 13px; margin-top: 4px; animation: slideIn 0.3s ease forwards; text-shadow: 1px 1px 2px #000; font-weight: bold;}
    .chat-msg.system { color: #a4b0be; } .chat-msg.damage { color: var(--danger); } .chat-msg.heal { color: var(--success); } .chat-msg.info { color: var(--primary); }
    @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ================= 💬 對話框與突發危機框 ================= */
    #dialog-box {
        position: fixed; bottom: max(25px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); 
        width: 92%; max-width: 650px; max-height: 60dvh; overflow-y: auto; 
        background: linear-gradient(180deg, rgba(30, 40, 60, 0.95), rgba(15, 20, 30, 0.98)); 
        border: 2px solid rgba(79, 172, 254, 0.6); border-radius: 12px; padding: 20px; box-sizing: border-box;
        display: none; font-size: 18px; line-height: 1.6; z-index: 9999; color: #fff;
        pointer-events: auto; cursor: pointer; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }
    #dialog-box.crisis-mode {
        background: linear-gradient(180deg, rgba(60, 20, 25, 0.96), rgba(25, 10, 15, 0.98));
        border: 2px solid var(--danger);
        box-shadow: 0 0 35px rgba(255, 71, 87, 0.6);
    }
    #dialog-name { color: #feca57; font-weight: 900; margin-bottom: 10px; font-size: 22px; text-shadow: 0 2px 5px rgba(0,0,0,0.8);}
    #dialog-hint { font-size: 14px; color: #888; margin-top: 15px; text-align: right; font-weight: bold; animation: pulse 1s infinite;}
    @keyframes pulse { 50% { opacity: 0.3; } }
    
    #choices-container { display: none; flex-direction: column; gap: 12px; margin-top: 20px; }
    .choice-btn { background: rgba(79, 172, 254, 0.15); color: #fff; padding: 14px 20px; border-radius: 8px; border: 1px solid var(--primary); text-align: center; font-weight: bold; cursor: pointer; transition: 0.1s; }
    .choice-btn:active { background: rgba(79, 172, 254, 0.6); transform: scale(0.98); }

    /* ================= 🎭 螢幕遮罩與選單 ================= */
    .overlay-screen { 
        position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; 
        display: none; flex-direction: column; justify-content: center; align-items: center; 
        z-index: 9999; text-align: center; backdrop-filter: blur(5px); 
        animation: fadeIn 0.5s ease forwards; overflow-y: auto; padding: 20px 10px; box-sizing: border-box;
        touch-action: pan-y;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .class-selector {
        display: flex; gap: 10px; width: 95%; max-width: 500px; justify-content: center; margin-top: 8px; pointer-events: auto;
    }
    .class-card {
        flex: 1; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15);
        border-radius: 10px; padding: 10px 6px; cursor: pointer; transition: 0.2s; color: #fff;
    }
    .class-card.selected {
        background: rgba(79, 172, 254, 0.25); border-color: var(--primary);
        box-shadow: 0 0 15px rgba(79, 172, 254, 0.5); transform: translateY(-3px);
    }
    .class-icon { font-size: 24px; margin-bottom: 2px; }
    .class-title { font-size: 13px; font-weight: 900; color: var(--warning); margin-bottom: 2px; }
    .class-desc { font-size: 10px; color: #dfe4ea; line-height: 1.3; }

    .btn-action { margin-top: 15px; padding: 12px 35px; background: linear-gradient(90deg, var(--primary), #00f2fe); color: #fff; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: 900; box-shadow: 0 0 20px rgba(79, 172, 254, 0.5); pointer-events: auto; border: none; letter-spacing: 2px; flex-shrink: 0;}
    .btn-action:active { transform: scale(0.95); }
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-3px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

    /* 排行榜與成就面板 */
    .leaderboard {
        margin-top: 10px; width: 95%; max-width: 360px;
        background: rgba(0,0,0,0.65); padding: 10px 15px; border-radius: 12px;
        border: 1px solid var(--warning); box-sizing: border-box; box-shadow: 0 5px 15px rgba(0,0,0,0.5); flex-shrink: 0;
    }
    .leaderboard-row {
        display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 5px; margin-bottom: 5px; font-size: 13px; color: #ffffff;
    }
    .leaderboard-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    /* 🏆 成就獎盃櫃彈窗樣式 */
    #trophy-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
        background: rgba(10, 15, 25, 0.95); z-index: 500; flex-direction: column;
        justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        backdrop-filter: blur(8px);
    }
    .trophy-item {
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px; padding: 10px 15px; display: flex; align-items: center; gap: 15px;
        width: 100%; max-width: 340px; box-sizing: border-box; opacity: 0.5;
    }
    .trophy-item.unlocked {
        background: rgba(255, 165, 2, 0.12); border-color: var(--warning); opacity: 1.0;
        box-shadow: 0 0 15px rgba(255, 165, 2, 0.3);
    }
    .trophy-icon { font-size: 28px; filter: grayscale(100%); }
    .trophy-item.unlocked .trophy-icon { filter: none; }
    .trophy-info { display: flex; flex-direction: column; text-align: left; }
    .trophy-name { font-size: 14px; font-weight: 900; color: #fff; margin-bottom: 2px; }
    .trophy-desc { font-size: 11px; color: #a4b0be; line-height: 1.3; }

    #ending-badge {
        display: none; background: linear-gradient(90deg, #ff9f43, #ff6b6b); color: #fff;
        padding: 6px 18px; border-radius: 20px; font-weight: 900; font-size: 16px;
        margin-bottom: 10px; box-shadow: 0 0 15px rgba(255, 107, 107, 0.6); letter-spacing: 1px;
    }

    /* ================= 📱 手機版排版優化 ================= */
    @media (max-width: 768px) {
        #hud-container { padding: 10px 5px; }
        #hud-player { top: max(15px, env(safe-area-inset-top)); left: 15px; transform: scale(0.9); transform-origin: top left; }
        #hud-quest { top: max(85px, calc(env(safe-area-inset-top) + 70px)); left: 15px; right: auto; transform: scale(0.9); transform-origin: top left; padding: 12px; min-width: 170px; }
        #hud-chat { display: none; } 
        
        #dialog-box { padding: 18px; bottom: max(20px, env(safe-area-inset-bottom)); }
        #dialog-name { font-size: 19px; margin-bottom: 6px; }
        #dialog-text { font-size: 16px; }
        .choice-btn { padding: 12px 15px; font-size: 15px; margin-top: 5px; }

        #start-title { font-size: 26px!important; margin-bottom: 5px!important; }
        .class-icon { font-size: 20px; }
        .class-title { font-size: 12px; }
        .class-desc { font-size: 9px; }
        
        #ending-icon { font-size: 45px!important; margin-bottom: 5px!important; }
        #ending-title { font-size: 26px!important; margin-bottom: 5px!important; }
        #ending-desc { font-size: 13px!important; padding: 0 10px; }
        .btn-action { font-size: 17px; padding: 10px 25px; margin-top: 10px; }
    }
</style>
</head>
<body>

<div id="game-container">
    
    <div id="hud-container">
        <div id="hud-player" class="hud-panel">
            <div id="player-avatar"><span id="avatar-emoji">🧚‍♀️</span><img id="avatar-img" src="" alt=""></div>
            <div id="player-info">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4px;">
                    <div id="player-name">Lv.99 隊輔</div>
                    <div id="mood-text" style="font-size: 13px; font-weight: bold; color: #a4b0be;">15/15</div>
                </div>
                <div id="hp-bar-bg"><div id="hp-bar"></div></div>
            </div>
        </div>

        <div id="hud-quest" class="hud-panel">
            <div class="quest-title">📜 主線任務：營隊危機</div>
            <div class="quest-item"><span>💬 安撫學員與幹部</span> <span id="quest-progress">0/12</span></div>
            <div class="quest-item"><span>🎒 尋回遺失的物資</span> <span id="supply-progress">0/3</span></div>
            <div id="timer-display">⏱️ 0 秒</div>
        </div>
    </div>

    <div id="hud-chat" class="hud-panel">
        <div class="chat-msg system">歡迎來到營隊生存模擬器。</div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="dialog-box">
        <div id="dialog-name"></div>
        <div id="dialog-text"></div>
        <div id="choices-container"></div>
        <div id="dialog-hint">▼ 點擊繼續 (或點擊對話框)</div>
    </div>
    
    <!-- 📖 開始畫面 (含職業選擇、獎盃櫃與排行榜) -->
    <div id="start-screen-overlay" class="overlay-screen" style="display: flex; background: rgba(20, 30, 40, 0.96); z-index: 200;">
        <div style="font-size: 40px; margin-bottom: 3px; filter: drop-shadow(0 0 20px rgba(79, 172, 254, 0.8));">🏕️</div>
        <div id="start-title" style="font-size: 28px; margin-bottom: 6px; font-weight: 900; letter-spacing: 2px; color: var(--primary);">營隊生存模擬器</div>
        
        <div style="font-size: 12px; color: #a4b0be; margin-bottom: 2px;">👇 請選擇你的隊輔天賦職業 👇</div>
        
        <!-- 🎭 職業選擇器 -->
        <div class="class-selector">
            <div class="class-card selected" id="card-athletic" onclick="selectClass('athletic')">
                <div class="class-icon">🏃</div>
                <div class="class-title">體能怪物</div>
                <div class="class-desc">移速+50% 走路不耗體力<br><span style="color:var(--danger);">選錯扣血加倍</span></div>
            </div>
            <div class="class-card" id="card-empath" onclick="selectClass('empath')">
                <div class="class-icon">🧠</div>
                <div class="class-title">讀心大師</div>
                <div class="class-desc">體力上限18 顯示最佳選項<br><span style="color:var(--danger);">移動速度略慢</span></div>
            </div>
            <div class="class-card" id="card-lucky" onclick="selectClass('lucky')">
                <div class="class-icon">🍀</div>
                <div class="class-title">佛系隊輔</div>
                <div class="class-desc">初始考核+1 危機強運<br><span style="color:var(--danger);">體力上限12</span></div>
            </div>
        </div>

        <!-- 🏆 開始畫面：即時排行榜 -->
        <div class="leaderboard" style="display: block;">
            <div style="color: var(--warning); font-weight: 900; margin-bottom: 6px; font-size: 14px; letter-spacing: 1px;">🏆 目前最速排行榜</div>
            <div id="start-leaderboard-list" style="text-align: left; font-size: 12px;">
                <div style="text-align:center; color:#fff;">📡 資料載入中...</div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; justify-content: center;">
            <button class="btn-action" style="background: linear-gradient(90deg, #f39c12, #f1c40f); padding: 10px 18px; font-size: 14px;" onclick="openTrophyModal()">🏆 榮譽獎盃櫃</button>
            <button class="btn-action" style="padding: 10px 22px; font-size: 14px;" onclick="startGame()">進入營隊</button>
        </div>
    </div>

    <!-- 🏆 成就獎盃櫃彈窗 -->
    <div id="trophy-modal">
        <div style="font-size: 22px; font-weight: 900; color: var(--warning); margin-bottom: 10px; letter-spacing: 1px;">🏆 隊輔榮譽獎盃櫃</div>
        <div id="trophy-list" style="width: 100%; max-width: 360px; max-height: 50dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
            <!-- 動態填入成就清單 -->
        </div>
        <button class="btn-action" style="margin-top: 0; padding: 10px 30px; font-size: 15px;" onclick="closeTrophyModal()">返回選單</button>
    </div>

    <!-- 🥀 / 🎉 結局畫面 -->
    <div id="ending-overlay" class="overlay-screen" style="background: rgba(15, 15, 20, 0.96);">
        <div id="ending-icon" style="font-size: 50px; margin-bottom: 6px;"></div>
        <div id="ending-title" style="font-size: 30px; margin-bottom: 6px; font-weight: 900;"></div>
        <div id="ending-badge">獲得稱號：【傳說隊輔】</div>
        <div id="ending-desc" style="font-size: 14px; color: #dfe4ea; line-height: 1.5; max-width: 420px; padding: 0 15px;"></div>
        
        <!-- 姓名與分享成績區塊 -->
        <div id="score-submit-area" style="display: none; flex-direction: column; align-items: center; width: 100%; margin-top: 12px;">
            <input type="text" id="player-name-input" placeholder="輸入大名留存稱號與紀錄..." maxlength="10" style="padding: 8px; font-size: 16px; border-radius: 8px; border: 2px solid var(--warning); text-align: center; margin-bottom: 10px; width: 80%; max-width: 240px; background: rgba(0,0,0,0.8); color: #fff; outline: none; pointer-events: auto;">
            <div style="display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap;">
                <button class="btn-action" style="margin-top: 0; padding: 10px 20px; font-size: 15px;" onclick="submitScore()">上傳雲端排行</button>
                <button class="btn-action" style="margin-top: 0; padding: 10px 20px; font-size: 15px; background: linear-gradient(90deg, #2ed573, #7bed9f);" onclick="copyScoreCard()">📋 複製戰績卡</button>
            </div>
        </div>

        <!-- 🏆 結算畫面：排行榜 -->
        <div id="ending-leaderboard" class="leaderboard" style="display: none;">
            <div style="color: var(--warning); font-weight: 900; margin-bottom: 6px; font-size: 14px; letter-spacing: 1px;">🏆 最速通關排行榜</div>
            <div id="ending-leaderboard-list" style="text-align: left; font-size: 12px;"></div>
        </div>

        <button id="restart-btn" class="btn-action" onclick="restartGame()">重新連線</button>
    </div>
</div>

<script>
    // ==========================================
    // 🖼️ 【真實圖片素材庫】
    // ==========================================
    const ASSET_URLS = {
        floor_wood: 'https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?w=200&h=200&fit=crop', 
        floor_grass: 'https://images.unsplash.com/photo-1533460004989-acf295ce70eb?w=200&h=200&fit=crop', 
        player: 'https://api.iconify.design/twemoji/fairy.svg?width=128&height=128', 
        npc_guagua: 'https://api.iconify.design/twemoji/man-teacher.svg?width=128&height=128', 
        npc_boy: 'https://api.iconify.design/twemoji/boy.svg?width=128&height=128', 
        npc_girl: 'https://api.iconify.design/twemoji/girl.svg?width=128&height=128', 
        npc_man: 'https://api.iconify.design/twemoji/man-student.svg?width=128&height=128', 
        npc_woman: 'https://api.iconify.design/twemoji/woman-student.svg?width=128&height=128',
        npc_chef: 'https://api.iconify.design/twemoji/man-cook.svg?width=128&height=128',
        chair: 'https://api.iconify.design/twemoji/chair.svg?width=128&height=128', 
        tree_big: 'https://api.iconify.design/twemoji/deciduous-tree.svg?width=128&height=128', 
        tree_small: 'https://api.iconify.design/twemoji/evergreen-tree.svg?width=128&height=128', 
        tent: 'https://api.iconify.design/twemoji/tent.svg?width=128&height=128', 
        door: 'https://api.iconify.design/twemoji/door.svg?width=128&height=128', 
        candy: 'https://api.iconify.design/twemoji/candy.svg?width=128&height=128', 
        boba: 'https://api.iconify.design/twemoji/bubble-tea.svg?width=128&height=128', 
        banana: 'https://api.iconify.design/twemoji/banana.svg?width=128&height=128',
        clipboard: 'https://api.iconify.design/twemoji/clipboard.svg?width=128&height=128',
        megaphone: 'https://api.iconify.design/twemoji/cheering-megaphone.svg?width=128&height=128',
        flag: 'https://api.iconify.design/twemoji/triangular-flag.svg?width=128&height=128'
    };

    const images = {};
    for (let key in ASSET_URLS) {
        images[key] = new Image();
        images[key].crossOrigin = "Anonymous"; 
        images[key].src = ASSET_URLS[key];
    }

    images['player'].onload = function() {
        const avatarEmoji = document.getElementById('avatar-emoji');
        const avatarImg = document.getElementById('avatar-img');
        if(avatarEmoji && avatarImg) {
            avatarEmoji.style.display = 'none';
            avatarImg.src = this.src;
            avatarImg.style.display = 'block';
        }
    };

    // ==========================================
    // 🏆 【成就系統與戰績卡片複製】
    // ==========================================
    const ACHIEVEMENTS_DATA = [
        { id: 'ach_first_win', icon: '🏕️', name: '初入營林', desc: '成功完成一次營隊挑戰結營' },
        { id: 'ach_speed_god', icon: '⚡', name: '光速傳說', desc: '解鎖「光速控場之神」稱號通關' },
        { id: 'ach_high_hp', icon: '💖', name: '鋼鐵意志', desc: '以剩餘體力 10 點以上成功通關' },
        { id: 'ach_all_classes', icon: '🎭', name: '全能導師', desc: '分別使用三種天賦職業成功通關過' }
    ];

    function checkAndUnlockAchievements(isVictory, timeUsed, endingTag, classKey) {
        let achs = JSON.parse(localStorage.getItem('camp_achievements')) || {};
        let classesUsed = JSON.parse(localStorage.getItem('camp_classes_used')) || [];
        let newlyUnlocked = [];

        if (isVictory) {
            if (!achs['ach_first_win']) { achs['ach_first_win'] = true; newlyUnlocked.push('初入營林'); }
            if (endingTag.includes('光速控場之神') && !achs['ach_speed_god']) { achs['ach_speed_god'] = true; newlyUnlocked.push('光速傳說'); }
            if (currentMood >= 10 && !achs['ach_high_hp']) { achs['ach_high_hp'] = true; newlyUnlocked.push('鋼鐵意志'); }
            
            if (!classesUsed.includes(classKey)) {
                classesUsed.push(classKey);
                localStorage.setItem('camp_classes_used', JSON.stringify(classesUsed));
            }
            if (classesUsed.length >= 3 && !achs['ach_all_classes']) {
                achs['ach_all_classes'] = true; newlyUnlocked.push('全能導師');
            }
        }
        localStorage.setItem('camp_achievements', JSON.stringify(achs));

        if (newlyUnlocked.length > 0) {
            setTimeout(() => {
                alert(`🎉 恭喜解鎖新成就：\n【${newlyUnlocked.join('、')}】\n快去主選單的「榮譽獎盃櫃」查看吧！`);
            }, 600);
        }
    }

    function shuffleArray(arr) {
        let copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {

            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

        triggeredCrises++;

        let available = CRISIS_POOL.map((_, idx) => idx).filter(idx => !usedCrisisIndices.has(idx));

        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';

        const shuffledChoices = shuffleArray(crisis.choices);

        shuffledChoices.forEach(choice => {
            let btn = document.createElement('div');
            btn.className = 'choice-btn';
            let hintTag = (CLASSES[selectedClassKey].showHint && choice.best) ? ' ✨(推薦)' : '';

    function isWalkable(x, y) {
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
        const scene = scenes[currentScene];
        for (let obj of scene.objects) if (x >= obj.x && x < obj.x + obj.w && y >= obj.y && y < obj.y + obj.h) return false;
        for (let npc of scene.npcs) if (x === npc.gridX && y === npc.gridY) return false;
        return true;
    }

    function findPath(startX, startY, targetX, targetY, isTargetNPC) {
        if (isTargetNPC && Math.abs(startX - targetX) + Math.abs(startY - targetY) === 1) return [];
        let queue = [{ x: startX, y: startY, path: [] }]; let visited = new Set([`${startX},${startY}`]);

        while (queue.length > 0) {
            let curr = queue.shift();
            if (isTargetNPC && Math.abs(curr.x - targetX) + Math.abs(curr.y - targetY) === 1) return curr.path;
            if (!isTargetNPC && curr.x === targetX && curr.y === targetY) return curr.path;

            const neighbors = [{ x: curr.x, y: curr.y - 1, dir: 'up' }, { x: curr.x, y: curr.y + 1, dir: 'down' }, { x: curr.x - 1, y: curr.y, dir: 'left' }, { x: curr.x + 1, y: curr.y, dir: 'right' }];
            for (let n of neighbors) {
                if (isWalkable(n.x, n.y) && !visited.has(`${n.x},${n.y}`)) {
                    visited.add(`${n.x},${n.y}`); queue.push({ x: n.x, y: n.y, path: [...curr.path, { x: n.x, y: n.y, dir: n.dir }] });
                }
            }
        }
        return null; 
    }

    let pathQueue = []; let isMoving = false; let finalPathAction = null;
    function startWalk(path, action) {
        pathQueue = path; finalPathAction = action; isMoving = true;
        if (pathQueue.length === 0) { isMoving = false; if (finalPathAction) finalPathAction(); }
    }

    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault(); 
        if (!isGameStarted || isDialogActive || isGameOver) return; 
        
        const rect = canvas.getBoundingClientRect(); 
        const targetGridX = Math.floor(((e.clientX - rect.left) / rect.width) * COLS); 
        const targetGridY = Math.floor(((e.clientY - rect.top) / rect.height) * ROWS);
        const scene = scenes[currentScene];

        let clickedNPC = scene.npcs.find(n => n.gridX === targetGridX && n.gridY === targetGridY);
        
        if (clickedNPC) {
            let path = findPath(player.gridX, player.gridY, clickedNPC.gridX, clickedNPC.gridY, true);
            if (path !== null) startWalk(path, () => { 
                let isStillAdjacent = Math.abs(player.gridX - clickedNPC.gridX) + Math.abs(player.gridY - clickedNPC.gridY) === 1;
                if (isStillAdjacent) {
                    player.facing = clickedNPC.gridX > player.gridX ? 'right' : clickedNPC.gridX < player.gridX ? 'left' : clickedNPC.gridY > player.gridY ? 'down' : 'up';
                    startDialog(clickedNPC); 
                } else {
                    logSystem(`[提示] 目標已移動，追蹤失敗`, "warning");
                }
            });
        } 
        else if (targetGridX === scene.portal.x && targetGridY === scene.portal.y) {
            let path = findPath(player.gridX, player.gridY, targetGridX, targetGridY, true);
            if (path !== null) startWalk(path, () => { 
                logSystem(`[系統] 讀取新區域中...`, "info");
                currentScene = scene.portal.toScene; player.gridX = scene.portal.toX; player.gridY = scene.portal.toY; 
                player.pixelX = player.gridX * TILE_SIZE; player.pixelY = player.gridY * TILE_SIZE;
            });
        }
        else if (isWalkable(targetGridX, targetGridY)) {
            let path = findPath(player.gridX, player.gridY, targetGridX, targetGridY, false);
            if (path !== null) startWalk(path, null);
        }
    });

    setInterval(() => {
        if (!isGameStarted || isDialogActive || isGameOver) return;
        const scene = scenes[currentScene];
        
        for (let npc of scene.npcs) {
            if (!npc.canMove || Math.random() > 0.6) continue;

            const dirs = [ {dx:0,dy:-1}, {dx:0,dy:1}, {dx:-1,dy:0}, {dx:1,dy:0} ];
            const dir = dirs[Math.floor(Math.random() * dirs.length)];
            const nx = npc.gridX + dir.dx; const ny = npc.gridY + dir.dy;

            if (Math.abs(nx - npc.startX) > 3 || Math.abs(ny - npc.startY) > 3) continue;
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
            if (nx === player.gridX && ny === player.gridY) continue; 
            if (nx === scene.portal.x && ny === scene.portal.y) continue; 
            
            let collision = false;
            for (let obj of scene.objects) if (nx >= obj.x && nx < obj.x + obj.w && ny >= obj.y && ny < obj.y + obj.h) collision = true;
            for (let otherNpc of scene.npcs) if (nx === otherNpc.gridX && ny === otherNpc.gridY) collision = true;
            
            if (!collision) {
                npc.gridX = nx; npc.gridY = ny;
            }
        }
    }, 1200);

    function lerp(start, end, factor) { return start + (end - start) * factor; }
    
    function drawNameLabel(title, name, px, py, isPlayer = false, isDone = false) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = isPlayer ? '#feca57' : '#a4b0be'; ctx.fillText(`[${title}]`, px, py - 18);
        let displayName = isDone ? `✅${name}` : name;
        ctx.font = '900 14px "微軟正黑體", sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.strokeText(displayName, px, py - 3);
        ctx.fillStyle = isPlayer ? '#1dd1a1' : (isDone ? '#2ed573' : '#ffffff'); ctx.fillText(displayName, px, py - 3);
    }

    function drawGraphic(imgKey, icon, px, py, tilesW = 1, tilesH = 1) {
        if (imgKey && images[imgKey] && images[imgKey].complete && images[imgKey].naturalWidth > 0) {
            let imgW = tilesW * TILE_SIZE; let imgH = tilesH * TILE_SIZE;
            ctx.drawImage(images[imgKey], px - imgW/2, py - imgH/2, imgW, imgH);
        } else {
            let size = tilesW > 1 ? 70 : 36;
            ctx.fillStyle = '#000000'; ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(icon, px, py + 2);
        }
    }

    function gameLoop(timestamp) {
        const scene = scenes[currentScene];
        const cls = CLASSES[selectedClassKey];
        
        if (isMoving && pathQueue.length > 0) {
            let targetX = pathQueue[0].x * TILE_SIZE; let targetY = pathQueue[0].y * TILE_SIZE;
            player.pixelX = lerp(player.pixelX, targetX, cls.speed); 
            player.pixelY = lerp(player.pixelY, targetY, cls.speed);
            player.facing = pathQueue[0].dir;

            if (Math.abs(player.pixelX - targetX) < 1.5 && Math.abs(player.pixelY - targetY) < 1.5) {
                player.gridX = pathQueue[0].x; player.gridY = pathQueue[0].y;
                player.pixelX = targetX; player.pixelY = targetY;
                pathQueue.shift();
                
                let item = scene.items?.find(i => i.x === player.gridX && i.y === player.gridY && !i.picked);
                if (item) { 
                    item.picked = true; 
                    changeMood(item.heal); 
                    if (item.isSupply) {
                        collectedSupplies++;
                        updateQuestUI();
                        logSystem(`[任務] 尋回物資：${item.name} (${collectedSupplies}/${SUPPLY_GOAL})`, "heal");
                        addFloatingText(player.pixelX + TILE_SIZE/2, player.pixelY - 20, `尋回 ${item.name}!`, '#4facfe');
                        checkAllQuestsCompleted();
                    } else {
                        logSystem(`[拾取] 獲得 ${item.name}`, "info");
                    }
                }

                stepCount++;
                if (stepCount >= cls.walkStepsCost) { stepCount = 0; changeMood(-1); }

                if (pathQueue.length === 0) { isMoving = false; if (finalPathAction) finalPathAction(); }
            }
        }

        for (let npc of scene.npcs) {
            npc.pixelX = lerp(npc.pixelX, npc.gridX * TILE_SIZE, 0.15); npc.pixelY = lerp(npc.pixelY, npc.gridY * TILE_SIZE, 0.15);
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for(let r = 0; r < ROWS; r++) {
            for(let c = 0; c < COLS; c++) {
                let floorKey = scene.type === 'grass' ? 'floor_grass' : 'floor_wood';
                if (images[floorKey] && images[floorKey].complete && images[floorKey].naturalWidth > 0) {
                    ctx.drawImage(images[floorKey], c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else {
                    ctx.fillStyle = scene.type === 'grass' ? textures.grass : textures.wood;
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        drawGraphic(scene.portal.imgKey, scene.portal.icon, scene.portal.x * TILE_SIZE + TILE_SIZE/2, scene.portal.y * TILE_SIZE + TILE_SIZE/2, 1, 1);
        let breatheOffset = Math.sin(timestamp / 200) * 3; 
        
        if (scene.items) {
            for (let item of scene.items) { 
                if (!item.picked) {
                    let ix = item.x * TILE_SIZE + TILE_SIZE/2;
                    let iy = item.y * TILE_SIZE + TILE_SIZE/2;
                    if (item.isSupply) {
                        ctx.fillStyle = 'rgba(255, 165, 2, 0.35)';
                        ctx.beginPath(); ctx.arc(ix, iy + breatheOffset, 22, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(ix, item.y*TILE_SIZE+40, 10, 5, 0, 0, Math.PI*2); ctx.fill();
                    drawGraphic(item.imgKey, item.icon, ix, iy + breatheOffset, 1, 1); 
                }
            }
        }

        for (let obj of scene.objects) {
            let cx = obj.x * TILE_SIZE + (obj.w * TILE_SIZE)/2; let cy = obj.y * TILE_SIZE + (obj.h * TILE_SIZE)/2;
            drawGraphic(obj.imgKey, obj.icon, cx, cy, obj.w, obj.h);
        }

        for (let npc of scene.npcs) {
            let cx = npc.pixelX + TILE_SIZE/2; let cy = npc.pixelY + TILE_SIZE/2;
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(cx, cy + 15, 14, 6, 0, 0, Math.PI*2); ctx.fill(); 
            drawGraphic(npc.imgKey, npc.icon, cx, cy + breatheOffset, 1, 1); 
            drawNameLabel(npc.title, npc.name, cx, cy, false, talkedTo.has(npc.name)); 
        }

        let px = player.pixelX + TILE_SIZE/2; let py = player.pixelY + TILE_SIZE/2;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(px, py + 15, 14, 6, 0, 0, Math.PI*2); ctx.fill();
        drawGraphic(player.imgKey, player.icon, px, py + breatheOffset, 1, 1);
        drawNameLabel(cls.titlePrefix, "隊輔", px, py, true); 

        ctx.fillStyle = "rgba(79, 172, 254, 0.8)"; ctx.beginPath();
        if(player.facing === 'up') { ctx.moveTo(px, py-26); ctx.lineTo(px-6, py-18); ctx.lineTo(px+6, py-18); }
        if(player.facing === 'down') { ctx.moveTo(px, py+26); ctx.lineTo(px-6, py+18); ctx.lineTo(px+6, py+18); }
        if(player.facing === 'left') { ctx.moveTo(px-26, py); ctx.lineTo(px-18, py-6); ctx.lineTo(px-18, py+6); }
        if(player.facing === 'right') { ctx.moveTo(px+26, py); ctx.lineTo(px+18, py-6); ctx.lineTo(px+18, py+6); }
        ctx.fill();

        let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 200, canvas.width/2, canvas.height/2, canvas.width/1.2);
        gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,0.7)'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 0.6; ft.life -= 0.02; 
            if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
            ctx.font = '900 22px "微軟正黑體", sans-serif'; ctx.textAlign = 'center';
            ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 4; ctx.globalAlpha = ft.life; 
            ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(gameLoop);
    }

    updateMoodUI();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
